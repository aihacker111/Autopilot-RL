# LOTUS v5. Entry point: python rl/v5_train.py --config configs/v5_full.yaml
# Hardware starting point: 1 CUDA GPU with >=16 GB VRAM, 8+ CPU cores, >=32 GB RAM.
# Profile first; no setting is a claim of optimality. Use --device cpu for smoke.
v5:
  out: rl/runs/lotus_v5_full
  seed: 2026
  split_seed: 2026
  device: auto
  workers: 4
  envs: 4
  threads: 2
  steps: 5000000
  generated_maps: false
  traffic: rules
  npc_policy: rl/runs/npc/npc.json
  half: 850
  routes: [500, 1000, 2000, 5000]
  route_weights: [0.35, 0.35, 0.20, 0.10]
  reseed: 600
  shield: true
  lateral_shield: true
  tracking: true
  memory: true
  latent: 320
  hidden: 512
  ensemble: 3
  heads: 4
  num_q: 5
  horizon: 8
  burn_in: 8
  batch: 128
  replay_capacity: 250000
  counterfactual_capacity: 20000
  counterfactual_probability: 0.02
  counterfactual_fraction: 0.15
  counterfactual_length: 20
  priority_fraction: 0.25
  teacher_steps: 10000
  teacher_probability: 0.03
  teacher_uncertainty_probability: 0.20
  learning_starts: 1024
  updates_per_transition: 0.125
  lr: 0.0003
  gamma: 0.99
  rho: 0.5
  tau: 0.01
  grad_clip: 20.0
  consistency_coef: 20.0
  reward_coef: 0.1
  value_coef: 0.1
  collision_coef: 1.0
  physics_coef: 2.0
  kinematics_coef: 1.0
  context_coef: 0.1
  entropy_coef: 0.0001
  teacher_coef: 0.5
  planner_coef: 0.5
  shield_coef: 0.5
  samples: 128
  elites: 24
  futures: 3
  iterations: 4
  adaptive_iterations: 1
  prior_plans: 16
  risk: 0.5
  cvar: 0.34
  temperature: 0.5
  exploration: 0.05
  collision_cost: 8.0
  uncertainty_cost: 2.0
  uncertainty_beta: 2.0
  uncertainty_threshold: 0.05
  latent_uncertainty_scale: 1.0
  distill_uncertainty_scale: 10.0
  distill_max_uncertainty: 0.10
  evo_start: 100000
  evo_every: 50000
  evo_candidates: 128
  evo_states: 64
  dream_batch: 16
  dream_horizon: 10
  evo_screen: 12
  evo_real: 4
  evo_retry: 1
  evo_prior_episodes: 2
  evo_min_episodes: 8
  evo_max_episodes: 24
  evo_teacher_episodes: 4
  evo_interval_width: 0.45
  pending_capacity: 128
  teacher_min: 0.25
  learn_min: 0.05
  realism_min: 0.5
  priors: calib/priors_vn.json
  progress_weight: 1.0
  novelty_weight: 0.02
  staleness_weight: 0.02
  pool_probability: 0.4
  eval_every: 100000
  eval_episodes: 96
  eval_batch: 4
  eval_max_decisions: 2000
  max_contact_per_km: 0.1
  max_red: 0.01
  checkpoint_every: 100000
  export_every: 10000
  log_every: 2000
